# Operator configuration consumed by the resource-metrics manager via the
# --server-config flag. This file is substituted into the base
# `resource-metrics-service-config` ConfigMap by configMapGenerator with
# behavior: replace (see kustomization.yaml).
#
# The apiVersion/kind are registered by SchemeBuilder in
# internal/config/groupversion_info.go:
#   GroupVersion = schema.GroupVersion{Group: "apiserver.config.miloapis.com", Version: "v1alpha1"}
#   SchemeBuilder.Register(&ResourceMetricsOperator{})
#
# Field names come from internal/config/config.go (ResourceMetricsOperator,
# DiscoveryConfig, OtelConfig).
apiVersion: apiserver.config.miloapis.com/v1alpha1
kind: ResourceMetricsOperator
discovery:
  mode: milo
  internalServiceDiscovery: false
  # Point project discovery and per-project client construction at
  # milo-apiserver (mounted from the milo-kubeconfig Secret). Without
  # this, the controller falls back to the in-cluster ServiceAccount
  # kubeconfig, which targets the kind apiserver — and kind does not
  # serve resourcemanager.miloapis.com, so Project discovery finds
  # nothing.
  discoveryKubeconfigPath: /etc/milo/kubeconfig
  projectKubeconfigPath: /etc/milo/kubeconfig
  collectRootControlPlane: true
otel:
  # endpoint is intentionally left unset so it can be overridden per consumer
  # via the OTEL_EXPORTER_OTLP_ENDPOINT env var (see SetDefaults_OtelConfig).
  # When neither is set it defaults to this repo's own test-infra collector,
  # otel-collector-collector.otel-collector-system:4317 (the OTel Operator
  # renders `<cr-name>-collector` for the `otel-collector` CR). Consumers whose
  # collector lives elsewhere set the env var in a Deployment patch.
  insecure: true
  collectionInterval: 5s
  defaultMetricPrefix: ""
